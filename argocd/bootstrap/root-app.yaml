# Use the default project here so the bootstrap app can create the non-default `platform` AppProject.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/zowalska/k8s-production-platform.git
      targetRevision: main
      path: argocd/projects
      directory:
        recurse: true
    - repoURL: https://github.com/zowalska/k8s-production-platform.git
      targetRevision: main
      path: argocd/applications
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
