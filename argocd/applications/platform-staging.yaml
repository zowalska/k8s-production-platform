# Staging still auto-syncs from Git, but self-heal stays off so temporary promotion checks are not reverted instantly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: platform
  source:
    repoURL: https://github.com/zowalska/k8s-production-platform.git
    targetRevision: main
    path: helm/platform
    helm:
      releaseName: platform
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
