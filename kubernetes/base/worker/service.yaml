apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  clusterIP: None # headless: worker has no load-balanced traffic, this Service exists purely so Prometheus can discover it
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 3001
      targetPort: metrics
