apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - networkpolicy-default-deny.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - api/configmap.yaml
  - api/networkpolicy.yaml
  - api/poddisruptionbudget.yaml
  - worker/deployment.yaml
  - worker/service.yaml
  - worker/hpa.yaml
  - worker/configmap.yaml
  - worker/networkpolicy.yaml
  - worker/poddisruptionbudget.yaml

images:
  - name: ghcr.io/zowalska/k8s-production-platform-api
    newTag: latest
  - name: ghcr.io/zowalska/k8s-production-platform-worker
    newTag: latest
