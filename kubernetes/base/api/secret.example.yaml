# EXAMPLE ONLY - do not apply as-is and never commit real secret values here.
#
# In this platform, runtime secrets (DATABASE_URL, REDIS_URL, JWT_SECRET) are
# normally delivered via the HashiCorp Vault Agent Injector sidecar when
# deployed through the Helm chart (see helm/platform and security/vault/).
#
# For a plain local/dev cluster (kind/minikube) without Vault, create the
# equivalent Secret manually instead of committing one:
#
#   kubectl create secret generic api-secrets -n platform-dev \
#     --from-literal=DATABASE_URL=postgres://platform:platform@platform-postgresql:5432/platform \
#     --from-literal=REDIS_URL=redis://platform-redis-master:6379 \
#     --from-literal=JWT_SECRET=local-dev-secret
#
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: platform
type: Opaque
stringData:
  DATABASE_URL: "postgres://platform:CHANGE_ME@platform-postgresql:5432/platform"
  REDIS_URL: "redis://platform-redis-master:6379"
  JWT_SECRET: "CHANGE_ME"
