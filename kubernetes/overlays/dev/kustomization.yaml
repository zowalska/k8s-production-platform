apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-dev

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: platform-dev
      environment: dev
    includeSelectors: false

patches:
  - path: patch-deployment-api.yaml
  - path: patch-deployment-worker.yaml
  - path: patch-hpa-api.yaml
  - path: patch-hpa-worker.yaml

images:
  - name: ghcr.io/zowalska/k8s-production-platform-api
    newTag: dev
  - name: ghcr.io/zowalska/k8s-production-platform-worker
    newTag: dev
