apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-worker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: platform
spec:
  # One ServiceMonitor can discover worker services in every platform namespace.
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: platform
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      # See api-servicemonitor.yaml for why this relabeling exists.
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          targetLabel: service
