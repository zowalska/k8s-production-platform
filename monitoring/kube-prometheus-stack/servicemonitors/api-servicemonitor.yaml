apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: platform
spec:
  # One ServiceMonitor can discover api services in every platform namespace.
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: platform
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      # Project the Service's app.kubernetes.io/name label onto a stable
      # `service` metric label. Needed because the underlying Service's own
      # metadata.name differs by deployment path/environment (plain "api"
      # via kubernetes/base, "platform-<env>-api" via the Helm chart Argo CD
      # deploys) - Prometheus Operator's auto-attached `service` label would
      # otherwise be inconsistent across dev/staging/prod, breaking every
      # `service="api"` selector in monitoring/alerts/platform-rules.yaml
      # and the Grafana dashboards under monitoring/grafana/dashboards/.
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          targetLabel: service
