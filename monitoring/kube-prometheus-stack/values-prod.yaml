# Production profile for kube-prometheus-stack.
# This keeps Prometheus and Alertmanager highly available, uses larger PVCs,
# and adds anti-affinity so replicas spread across nodes.

crds:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: platform-alerts
    receivers:
      - name: platform-alerts
        slack_configs:
          - channel: "#platform-alerts"
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: '{{ template "slack.default.text" . }}'
        webhook_configs:
          - url: https://alerts.platform.example.com/webhook # replace per environment
            send_resolved: true
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal:
          - alertname
          - namespace
  alertmanagerSpec:
    replicas: 2
    retention: 240h
    secrets:
      - alertmanager-slack-webhook
    podAntiAffinity: "hard"
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: REPLACE_ME_STORAGE_CLASS
          resources:
            requests:
              storage: 10Gi

prometheus:
  prometheusSpec:
    replicas: 2
    shards: 1
    retention: 30d
    retentionSize: 180GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    enableAdminAPI: false
    externalLabels:
      environment: prod
      cluster: platform-prod
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}
    podAntiAffinity: "hard"
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: REPLACE_ME_STORAGE_CLASS
          resources:
            requests:
              storage: 200Gi
    # Uncomment to ship long-term metrics to a managed backend.
    # remoteWrite:
    #   - url: https://replace-me.example.com/api/v1/write
    #     basicAuth:
    #       username:
    #         name: prometheus-remote-write
    #         key: username
    #       password:
    #         name: prometheus-remote-write
    #         key: password

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - grafana.prod.platform.example.com # replace with the real production hostname
    tls:
      - secretName: grafana-prod-tls
        hosts:
          - grafana.prod.platform.example.com
  grafana.ini:
    server:
      domain: grafana.prod.platform.example.com
      root_url: https://grafana.prod.platform.example.com
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
    datasources:
      enabled: true
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 2000
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    storageClassName: REPLACE_ME_STORAGE_CLASS
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 75m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi
