# Promtail runs as a DaemonSet on every node and tails Kubernetes pod logs.
# The custom scrape config below focuses on platform namespaces and parses the
# structured JSON logs emitted by api and worker.

configmap:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

serviceMonitor:
  enabled: true
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
  interval: 30s

config:
  enabled: true
  logLevel: info
  logFormat: json
  serverPort: 3101
  clients:
    - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
  positions:
    filename: /run/promtail/positions.yaml
  snippets:
    extraLimitsConfig: |
      readline_rate_enabled: true
      readline_rate: 10000
      readline_burst: 20000
    # Override the default scrape config so the intent is explicit in Git.
    scrapeConfigs: |
      - job_name: kubernetes-pods-platform
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
          - match:
              selector: '{namespace=~"platform-.*", app=~"api|worker"}'
              stages:
                - json:
                    expressions:
                      level: level
                      message: msg
                      ts: time
                      request_id: requestId
                - labels:
                    level:
                    request_id:
                - timestamp:
                    source: ts
                    format: RFC3339
                    action_on_failure: fudge
                - output:
                    source: message
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_namespace
            regex: platform-.*
            action: keep
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
            regex: platform
            action: keep
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: api|worker
            action: keep
          - source_labels:
              - __meta_kubernetes_pod_controller_name
            regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
            target_label: __tmp_controller_name
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app
              - __tmp_controller_name
              - __meta_kubernetes_pod_name
            regex: ^;*([^;]+)(;.*)?$
            target_label: app
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
            target_label: part_of
            action: replace
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
            action: replace
          - source_labels:
              - namespace
              - app
            separator: /
            replacement: $1
            target_label: job
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
              - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
              - __meta_kubernetes_pod_container_name
            separator: /
            regex: true/(.*)
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
            action: replace
