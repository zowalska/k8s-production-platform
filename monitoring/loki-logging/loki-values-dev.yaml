# Development Loki profile using a single binary and local filesystem storage.
# This keeps the topology simple while still exercising the same chart and
# gateway entrypoint used by Promtail and Grafana.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    retention_period: 72h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: filesystem

serviceAccount:
  create: true
  name: loki

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: null # use the cluster default storage class in dev

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

gateway:
  enabled: true
  replicas: 1
  verboseLogging: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

lokiCanary:
  enabled: false

minio:
  enabled: false

test:
  enabled: false
