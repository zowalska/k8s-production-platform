# Production Loki profile using simple scalable mode and S3 object storage.
# The bucket and IRSA role are intentionally left as placeholders for
# environment-specific Argo CD overrides.

deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 2
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: platform-prod-loki-chunks # set via ArgoCD Application parameter or values override per environment
      ruler: platform-prod-loki-chunks # same bucket is acceptable when using separate prefixes
      admin: platform-prod-loki-chunks # same bucket is acceptable when using separate prefixes
    s3:
      endpoint: s3.amazonaws.com
      region: us-east-1 # replace per environment
      s3ForcePathStyle: false
  limits_config:
    ingestion_rate_mb: 32
    ingestion_burst_size_mb: 64
    retention_period: 720h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: s3

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/platform-prod-loki-irsa # set via ArgoCD Application parameter or values override per environment

singleBinary:
  replicas: 0

read:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

write:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    volumeClaimsEnabled: true
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    storageClass: REPLACE_ME_STORAGE_CLASS

backend:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    volumeClaimsEnabled: true
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClass: REPLACE_ME_STORAGE_CLASS

gateway:
  enabled: true
  replicas: 2
  verboseLogging: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

lokiCanary:
  enabled: false

minio:
  enabled: false

test:
  enabled: false
