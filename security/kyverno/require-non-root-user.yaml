apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-user
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Belt-and-suspenders check on top of the "restricted" Pod Security
      Standard enforced at the namespace level (see
      ../namespaces/*.yaml) - denies any Pod in a platform-* namespace
      that doesn't explicitly set runAsNonRoot: true, either at the pod or
      every container level.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-runasnonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: app.kubernetes.io/part-of
                    operator: In
                    values:
                      - platform
      validate:
        message: "Containers must set securityContext.runAsNonRoot=true (pod- or container-level)."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
