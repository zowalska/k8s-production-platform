# Overrides for the "prod" environment - external RDS/ElastiCache, higher
# replica floors, pod anti-affinity across zones, ingress with TLS. Applied
# as:
#   helm upgrade --install platform-prod ./helm/platform -n platform-prod \
#     -f values.yaml -f values-prod.yaml

global:
  environment: prod
  namespace: platform-prod

api:
  replicaCount: 3
  image:
    tag: stable
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: api
  vault:
    enabled: true
    role: platform-prod-api
    secretPath: secret/data/platform/prod/api
    template: |
      {{- with secret "secret/data/platform/prod/api" -}}
      export DATABASE_URL="{{ .Data.data.DATABASE_URL }}"
      export REDIS_URL="{{ .Data.data.REDIS_URL }}"
      export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
      {{- end -}}

worker:
  replicaCount: 3
  image:
    tag: stable
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: false # superseded by the KEDA ScaledObject - see autoscaling/keda/
    minReplicas: 3
    maxReplicas: 15
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: worker
  vault:
    enabled: true
    role: platform-prod-worker
    secretPath: secret/data/platform/prod/worker
    template: |
      {{- with secret "secret/data/platform/prod/worker" -}}
      export DATABASE_URL="{{ .Data.data.DATABASE_URL }}"
      export REDIS_URL="{{ .Data.data.REDIS_URL }}"
      {{- end -}}

postgresql:
  enabled: false
redis:
  enabled: false
externalDatabase:
  host: "platform-prod.CHANGE_ME.eu-central-1.rds.amazonaws.com"
  port: 5432
  database: platform
externalRedis:
  host: "platform-prod.CHANGE_ME.cache.amazonaws.com"
  port: 6379

ingress:
  enabled: true
  className: nginx
  host: api.platform.example.com
  tls: true
