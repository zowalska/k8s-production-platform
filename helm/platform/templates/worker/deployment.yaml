apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-worker
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        # See apps/api's deployment.yaml for why platform.selectorLabels
        # isn't also included here (duplicate app.kubernetes.io/instance key).
        app.kubernetes.io/name: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/worker/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- if .Values.worker.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.worker.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.worker.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-config: |
          {{- .Values.worker.vault.template | nindent 10 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.worker.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.worker.vault.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- if .Values.worker.vault.enabled }}
          command: ["sh", "-c"]
          args:
            - |
              . /vault/secrets/config
              exec node src/index.js
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "platform.fullname" . }}-worker-config
            {{- if not .Values.worker.vault.enabled }}
            - secretRef:
                name: {{ include "platform.fullname" . }}-worker-secrets
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
