{{- if .Values.worker.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccount.name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
  # Bound to the Vault Kubernetes auth role `platform-<env>-worker` - see
  # security/vault/auth/kubernetes-auth-setup.sh.
{{- end }}
