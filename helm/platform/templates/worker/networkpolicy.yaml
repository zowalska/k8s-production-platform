{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-worker
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.worker.metricsPort }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.worker.vault.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
    {{- end }}
{{- end }}
