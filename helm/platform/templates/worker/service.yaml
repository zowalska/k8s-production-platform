apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-worker
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
spec:
  type: ClusterIP
  clusterIP: None # headless: exists only for Prometheus service discovery, worker takes no application traffic
  selector:
    {{- include "platform.selectorLabels" (dict "root" $ "component" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
