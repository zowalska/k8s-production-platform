{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
  # This ServiceAccount's name+namespace is what the Vault Kubernetes auth
  # role `platform-<env>-api` is bound to - see
  # security/vault/auth/kubernetes-auth-setup.sh.
{{- end }}
