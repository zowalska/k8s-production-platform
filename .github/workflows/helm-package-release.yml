name: Helm Package Release

on:
  push:
    tags:
      - 'helm-v*'

jobs:
  package-release:
    name: Package and release chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Update chart dependencies
        run: helm dependency update helm/platform

      - name: Package chart
        run: |
          mkdir -p dist
          helm package helm/platform --destination dist

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
          body: |
            Packaged Helm chart release for `helm/platform`.

            Note: Publishing the chart as an OCI artifact to `ghcr.io` is a common real-world alternative to GitHub release assets.
