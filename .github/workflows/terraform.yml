# Portfolio note:
# - This workflow intentionally uses `terraform init -backend=false` because the repo does not ship live backend or cloud credentials for CI.
# - A production deployment would typically configure AWS_ROLE_TO_ASSUME, AWS_REGION, TF_STATE_BUCKET, TF_STATE_DYNAMODB_TABLE, and any environment-specific secrets/vars before enabling real plans/applies.
name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

  validate-plan:
    name: Terraform validate/plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging
          - prod
    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (no remote backend in CI)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      # This showcase repo intentionally omits live AWS backend credentials, so `terraform plan`
      # may fail or be partial until AWS_ROLE_TO_ASSUME / TF_STATE_BUCKET and related settings are configured.
      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ matrix.environment }}-plan
          path: |
            terraform/environments/${{ matrix.environment }}/tfplan
            terraform/environments/${{ matrix.environment }}/plan.txt
          if-no-files-found: warn

      - name: Comment plan summary on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_PATH: terraform/environments/${{ matrix.environment }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- terraform-plan:${process.env.ENVIRONMENT_NAME} -->`;
            const plan = fs.existsSync(process.env.PLAN_PATH)
              ? fs.readFileSync(process.env.PLAN_PATH, 'utf8')
              : 'terraform plan did not produce output. Configure backend/cloud secrets to enable a full plan.';
            const trimmed = plan.length > 60000
              ? `${plan.slice(0, 60000)}\n\n... output truncated ...`
              : plan;
            const body = `${marker}
            ## Terraform plan (${process.env.ENVIRONMENT_NAME})
            Status: **${process.env.PLAN_OUTCOME}**

            \`\`\`text
            ${trimmed}
            \`\`\`
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  apply-prod:
    name: Terraform apply (prod)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-plan
    environment: terraform-prod-apply
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download prod plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-prod-plan
          path: terraform/environments/prod
        continue-on-error: true

      - name: Terraform init (no remote backend in CI)
        run: terraform init -backend=false -input=false

      - name: Apply saved plan when available
        run: |
          if [ -f tfplan ]; then
            terraform apply -input=false -auto-approve tfplan
          else
            echo "No saved tfplan artifact was produced. Configure AWS_ROLE_TO_ASSUME, TF_STATE_BUCKET, and backend credentials to enable real production applies."
          fi
