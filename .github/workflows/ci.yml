name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
  pull_request:
    paths:
      - 'apps/**'

jobs:
  service-ci:
    name: Service CI (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: apps/${{ matrix.service }}
        run: npm run lint

      - name: Test with coverage
        working-directory: apps/${{ matrix.service }}
        run: npm test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: apps/${{ matrix.service }}/coverage
          if-no-files-found: warn

  manifests-validate:
    name: Validate manifests (${{ matrix.overlay }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        overlay:
          - dev
          - staging
          - prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl v1.31.1
        run: |
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.31.1/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kubeconform v0.6.7
        run: |
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate kustomize output
        run: |
          kubectl kustomize kubernetes/overlays/${{ matrix.overlay }} \
            | kubeconform -summary -strict -ignore-missing-schemas

  helm-lint:
    name: Helm lint and template validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform v0.6.7
        run: |
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Update chart dependencies
        run: helm dependency update helm/platform

      - name: Lint chart
        run: helm lint helm/platform -f helm/platform/values-dev.yaml

      - name: Validate rendered Helm manifests
        run: |
          helm template platform helm/platform -f helm/platform/values-dev.yaml \
            | kubeconform -summary -strict -ignore-missing-schemas
