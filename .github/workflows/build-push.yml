# Portfolio note:
# - This workflow publishes images to GHCR with the built-in GITHUB_TOKEN and signs them with GitHub OIDC; no static registry or cosign keys are required.
# - If you later enable the placeholder GitOps handoff job, configure a write-capable token such as GITOPS_REPO_TOKEN or a GitHub App token for the target manifests repo.
name: Build and Push Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/**'

jobs:
  build-and-push:
    name: Build and push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zowalska/k8s-production-platform-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/zowalska/k8s-production-platform-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Attest SBOM to registry
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/zowalska/k8s-production-platform-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.service }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest with keyless OIDC
        run: cosign sign --yes ghcr.io/zowalska/k8s-production-platform-${{ matrix.service }}@${{ steps.build.outputs.digest }}

      - name: Persist image digest
        run: echo "${{ matrix.service }}=${{ steps.build.outputs.digest }}" > image-digest-${{ matrix.service }}.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digest-${{ matrix.service }}.txt

  publish-digests:
    name: Publish image digests
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    outputs:
      image-digests: ${{ steps.collect.outputs.image_digests }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: image-digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Collect digest outputs
        id: collect
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          digests = {}
          for path in Path("image-digests").glob("*.txt"):
              service, digest = path.read_text(encoding="utf-8").strip().split("=", 1)
              digests[service] = digest

          payload = json.dumps(digests, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"image_digests={payload}\n")

          print(payload)
          PY

  # In production GitOps setups, Argo CD Image Updater or a PR automation bot would usually update
  # helm/platform/values-<env>.yaml after a successful image publish, so this showcase workflow does not open a PR by default.
  open-gitops-pr:
    if: ${{ false }}
    name: Placeholder GitOps PR hook
    runs-on: ubuntu-latest
    needs: publish-digests
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Placeholder
        run: echo "Hook your GitOps PR automation or Argo CD Image Updater integration here."
