name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-image:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image locally
        run: |
          docker build \
            --file apps/${{ matrix.service }}/Dockerfile \
            --tag ghcr.io/zowalska/k8s-production-platform-${{ matrix.service }}:security-${{ github.sha }} \
            apps/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/zowalska/k8s-production-platform-${{ matrix.service }}:security-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          # By default trivy-action drops the severity filter entirely when
          # format=sarif (so the SARIF/code-scanning view always shows every
          # severity), which meant `exit-code: 1` below was actually failing
          # this step on LOW/MEDIUM/UNKNOWN findings too, not just
          # HIGH/CRITICAL as configured. This keeps the severity filter
          # applied consistently so the build only fails on what we intend.
          limit-severities-for-sarif: true
          output: trivy-image-${{ matrix.service }}.sarif
          exit-code: '1'

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif

  iac-scan:
    name: IaC scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run tfsec on Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          format: sarif
          # tfsec-action runs in a container that mounts the checkout at
          # /github/workspace and cd's there before invoking tfsec, so the
          # --out path must be relative to that mount - not the host-side
          # `${{ github.workspace }}` absolute path (which doesn't exist
          # inside the container and previously caused "no such file or
          # directory", failing this step and every step after it).
          #
          # --no-module-downloads: our eks/vpc modules reference the public
          # terraform-aws-modules registry. Without this flag tfsec fetches
          # and statically analyzes those external modules too, and embeds
          # their (non-checkout-relative, sometimes git::-scheme) paths as
          # SARIF artifact locations, which the upload step then rejects
          # with "SARIF URI scheme ... did not match the checkout URI
          # scheme". We only want tfsec gating our own IaC, not re-auditing
          # third-party module internals.
          additional_args: --out reports/tfsec-terraform.sarif --no-module-downloads
          soft_fail: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/tfsec-terraform.sarif
          category: tfsec-terraform

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,reports/checkov-terraform.sarif

      - name: Upload Checkov Terraform SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov-terraform.sarif
          # Explicit, distinct categories are required: this job uploads
          # SARIF from the same tool (Checkov) three times, and without a
          # unique category each upload after the first is rejected with
          # "only one run of ... upload-sarif actions is allowed per job
          # per tool/category".
          category: checkov-terraform

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: kubernetes
          framework: kubernetes
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,reports/checkov-kubernetes.sarif

      - name: Upload Checkov Kubernetes SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov-kubernetes.sarif
          category: checkov-kubernetes

      - name: Run Checkov on Helm chart
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: helm
          framework: helm
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,reports/checkov-helm.sarif

      - name: Upload Checkov Helm SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov-helm.sarif
          category: checkov-helm

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
